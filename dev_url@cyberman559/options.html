<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Dev URL Switch — Настройки</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 400px;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 14px;
      color: #e0e0e0;
      background: #1e1e2e;
    }
    h1 { font-size: 20px; font-weight: 600; margin-bottom: 20px; color: #c9d1d9; }
    .field { margin-bottom: 16px; }
    label {
      display: block;
      font-size: 12px;
      color: #8b949e;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    input[type="text"] {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #30363d;
      border-radius: 6px;
      background: #0d1117;
      color: #e0e0e0;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="text"]:focus { border-color: #58a6ff; }
    input[type="text"]::placeholder { color: #484f58; }
    .hint { margin-top: 6px; font-size: 11px; color: #6e7681; line-height: 1.5; }
    .btn-save {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 6px;
      background: #238636;
      color: #fff;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-save:hover { background: #2ea043; }
    .status {
      margin-top: 16px;
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 12px;
      line-height: 1.6;
    }
    .status.active { background: #0d1f0d; border: 1px solid #238636; color: #3fb950; }
    .status.inactive { background: #1f0d0d; border: 1px solid #da3636; color: #f85149; }
    .status.saved { background: #0d1a2e; border: 1px solid #1f6feb; color: #58a6ff; }
  </style>
</head>
<body>
  <h1>⚙️ Dev URL Switch</h1>

  <div class="field">
    <label for="devDomain">Dev Domain</label>
    <input type="text" id="devDomain" placeholder="dev.ru" autocomplete="off">
    <div class="hint">Введите DEV домен (например: dev.ru).<br>
  </div>

  <button class="btn-save" id="saveBtn">Сохранить</button>

  <div class="status" id="status"></div>

  <script src="options.js"></script>
</body>
</html>
